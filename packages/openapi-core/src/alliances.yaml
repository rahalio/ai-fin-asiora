openapi: 3.1.0
info:
  title: Asiora Alliances API
  version: 0.1.0
  description: |
    Data alliance hub-vs-periphery risk scores (BR-5).
  license:
    name: Proprietary
    url: https://asiora.local/license
  x-domain: aln
servers:
  - url: https://api.asiora.local
    description: Local / Asiora API
security:
  - apiKey: []

tags:
  - name: Alliances
    description: Data alliance risk scores
paths:
  /v1/alliances:
    get:
      operationId: listAllianceScores
      tags: [Alliances]
      summary: List alliance scores
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: country
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./alliances.schemas.yaml#/components/schemas/AllianceScoreListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createAllianceScore
      tags: [Alliances]
      summary: Create alliance score
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./alliances.schemas.yaml#/components/schemas/AllianceScoreCreate
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./alliances.schemas.yaml#/components/schemas/AllianceScoreResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/alliances/{allianceId}:
    parameters:
      - name: allianceId
        in: path
        required: true
        schema:
          $ref: ./alliances.schemas.yaml#/components/schemas/AllianceId
    get:
      operationId: getAllianceScore
      tags: [Alliances]
      summary: Get alliance score
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./alliances.schemas.yaml#/components/schemas/AllianceScoreResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
