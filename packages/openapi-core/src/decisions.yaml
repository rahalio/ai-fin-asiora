openapi: 3.1.0
info:
  title: Asiora Decisions API
  version: 0.1.0
  description: |
    Funding decision ledger — append-only (BR-11).
  license:
    name: Proprietary
    url: https://asiora.local/license
  x-domain: dcs
servers:
  - url: https://api.asiora.local
    description: Local / Asiora API
security:
  - apiKey: []

tags:
  - name: Decisions
    description: Funding decision ledger
paths:
  /v1/decisions:
    get:
      operationId: listFundingDecisions
      tags: [Decisions]
      summary: List funding decisions
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: outcome
          in: query
          schema:
            $ref: ./decisions.schemas.yaml#/components/schemas/FundingOutcome
        - name: initiativeId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./decisions.schemas.yaml#/components/schemas/FundingDecisionListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: recordFundingDecision
      tags: [Decisions]
      summary: Record funding decision (immutable)
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./decisions.schemas.yaml#/components/schemas/FundingDecisionCreate
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./decisions.schemas.yaml#/components/schemas/FundingDecisionResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/decisions/{decisionId}:
    parameters:
      - name: decisionId
        in: path
        required: true
        schema:
          $ref: ./decisions.schemas.yaml#/components/schemas/DecisionId
    get:
      operationId: getFundingDecision
      tags: [Decisions]
      summary: Get funding decision
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./decisions.schemas.yaml#/components/schemas/FundingDecisionResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
