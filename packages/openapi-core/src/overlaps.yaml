openapi: 3.1.0
info:
  title: Asiora Overlaps API
  version: 0.1.0
  description: |
    Cross-vertical overlap clusters (BR-9).
  license:
    name: Proprietary
    url: https://asiora.local/license
  x-domain: ovl
servers:
  - url: https://api.asiora.local
    description: Local / Asiora API
security:
  - apiKey: []

tags:
  - name: Overlaps
    description: Overlap clusters
paths:
  /v1/overlaps:
    get:
      operationId: listOverlapClusters
      tags: [Overlaps]
      summary: List overlap clusters
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: status
          in: query
          schema:
            $ref: ./overlaps.schemas.yaml#/components/schemas/OverlapStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./overlaps.schemas.yaml#/components/schemas/OverlapClusterListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createOverlapCluster
      tags: [Overlaps]
      summary: Create overlap cluster
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./overlaps.schemas.yaml#/components/schemas/OverlapClusterCreate
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./overlaps.schemas.yaml#/components/schemas/OverlapClusterResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/overlaps/{overlapId}:
    parameters:
      - name: overlapId
        in: path
        required: true
        schema:
          $ref: ./overlaps.schemas.yaml#/components/schemas/OverlapId
    get:
      operationId: getOverlapCluster
      tags: [Overlaps]
      summary: Get overlap cluster
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./overlaps.schemas.yaml#/components/schemas/OverlapClusterResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/overlaps/{overlapId}/resolve:
    parameters:
      - name: overlapId
        in: path
        required: true
        schema:
          $ref: ./overlaps.schemas.yaml#/components/schemas/OverlapId
    post:
      operationId: resolveOverlapCluster
      tags: [Overlaps]
      summary: Resolve overlap (merge / split / keep)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./overlaps.schemas.yaml#/components/schemas/OverlapResolve
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./overlaps.schemas.yaml#/components/schemas/OverlapClusterResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
