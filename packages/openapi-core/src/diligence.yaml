openapi: 3.1.0
info:
  title: Asiora Diligence API
  version: 0.1.0
  description: |
    AM diligence and integration gates (BR-3).
  license:
    name: Proprietary
    url: https://asiora.local/license
  x-domain: dil
servers:
  - url: https://api.asiora.local
    description: Local / Asiora API
security:
  - apiKey: []

tags:
  - name: Diligence
    description: AM diligence and integration gates
paths:
  /v1/diligence:
    get:
      operationId: listDiligenceChecklists
      tags: [Diligence]
      summary: List diligence checklists
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: incompleteOnly
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./diligence.schemas.yaml#/components/schemas/DiligenceListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/initiatives/{initiativeId}/diligence:
    parameters:
      - name: initiativeId
        in: path
        required: true
        schema:
          type: string
          pattern: '^ini_[0-9A-HJKMNP-TV-Z]{26}$'
    get:
      operationId: getDiligence
      tags: [Diligence]
      summary: Get diligence checklist for initiative
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./diligence.schemas.yaml#/components/schemas/DiligenceResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    put:
      operationId: upsertDiligence
      tags: [Diligence]
      summary: Upsert diligence checklist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./diligence.schemas.yaml#/components/schemas/DiligenceUpsert
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./diligence.schemas.yaml#/components/schemas/DiligenceResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
